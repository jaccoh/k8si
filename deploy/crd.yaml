apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: k8sibackups.k8si.io
spec:
  group: k8si.io
  scope: Namespaced
  names:
    plural: k8sibackups
    singular: k8sibackup
    kind: K8siBackup
    shortNames: [k8b]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Last Backup
          type: string
          jsonPath: .status.lastBackupTime
        - name: Result
          type: string
          jsonPath: .status.lastBackupResult
        - name: Next Backup
          type: string
          jsonPath: .status.nextBackupTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [pvc, resticSecret, schedule]
              properties:
                pvc:
                  type: string
                  description: PVC name to back up (must be in the same namespace)
                resticSecret:
                  type: string
                  description: Secret with RESTIC_REPOSITORY, RESTIC_PASSWORD, RESTIC_SFTP_COMMAND, id_ed25519, known_hosts
                schedule:
                  type: string
                  description: Cron schedule for backups, e.g. "0 3 * * *"
                retention:
                  type: object
                  properties:
                    daily:
                      type: integer
                      default: 7
                    weekly:
                      type: integer
                      default: 4
                    monthly:
                      type: integer
                      default: 3
                preBackupHook:
                  type: string
                  description: Path to a script to run inside the backup container before restic backup
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
