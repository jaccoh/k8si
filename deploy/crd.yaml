apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: k8sibackups.k8si.io
spec:
  group: k8si.io
  scope: Namespaced
  names:
    plural: k8sibackups
    singular: k8sibackup
    kind: K8siBackup
    shortNames: [k8b]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Last Backup
          type: string
          jsonPath: .status.lastBackupTime
        - name: Result
          type: string
          jsonPath: .status.lastBackupResult
        - name: Duration
          type: integer
          jsonPath: .status.lastBackupDuration
        - name: Next Backup
          type: string
          jsonPath: .status.nextBackupTime
        - name: Paused
          type: boolean
          jsonPath: .spec.paused
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [pvc, resticSecret, schedule]
              properties:
                pvc:
                  type: string
                  description: PVC name to back up (must be in the same namespace)
                resticSecret:
                  type: string
                  description: Secret with RESTIC_REPOSITORY, RESTIC_PASSWORD, RESTIC_SFTP_COMMAND, id_ed25519, known_hosts
                schedule:
                  type: string
                  description: Cron schedule for backups, e.g. "0 3 * * *"
                backupMode:
                  type: string
                  enum: [snapshot, direct]
                  default: snapshot
                  description: Backup mode (snapshot = CSI VolumeSnapshot-first, direct = direct live volume backup)
                volumeSnapshotClass:
                  type: string
                  description: VolumeSnapshotClass to use; omit to use the cluster-default VolumeSnapshotClass
                restore:
                  type: object
                  description: Restore init-container configuration and pre-restore sanity checks
                  properties:
                    sentinels:
                      type: array
                      description: Files checked on disk (data health) and inside the snapshot (quality gate)
                      items:
                        type: string
                    required:
                      type: boolean
                      default: false
                      description: Fail loudly (CrashLoopBackOff) if no snapshot found instead of starting fresh
                    maxAge:
                      type: string
                      description: Refuse restore if latest snapshot is older than this (e.g. "7d", "168h")
                    size:
                      type: object
                      properties:
                        min:
                          type: string
                          description: Minimum snapshot restore size, e.g. "1Mi"
                        max:
                          type: string
                          description: Maximum snapshot restore size, e.g. "50Gi"
                    tags:
                      type: array
                      description: Only consider snapshots with these tags
                      items:
                        type: string
                retention:
                  type: object
                  properties:
                    daily:
                      type: integer
                      default: 7
                    weekly:
                      type: integer
                      default: 4
                    monthly:
                      type: integer
                      default: 3
                preSnapshotHook:
                  type: string
                  description: Path (inside the k8si image) to a script run before the VolumeSnapshot is taken
                preSnapshotHookRequired:
                  type: boolean
                  default: false
                  description: If true, a non-zero hook exit code aborts the backup (fail-closed)
                database:
                  type: object
                  description: Database-level quiescing before the VolumeSnapshot
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [mariadb, postgres, sqlite]
                    secretRef:
                      type: string
                      description: Secret with DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME (mariadb/postgres)
                    podSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: Label selector to find the running pod for exec (sqlite)
                    dbPaths:
                      type: array
                      description: Paths to SQLite DB files inside the pod (sqlite)
                      items:
                        type: string
                tags:
                  type: array
                  description: Tags applied to backup snapshots
                  items:
                    type: string
                paused:
                  type: boolean
                  default: false
                  description: Suspend all backups without deleting the CRD; set to true to pause, false (or omit) to resume
                backupWindow:
                  type: object
                  description: Restrict backups to a UTC time window; omit to allow backups at any time
                  properties:
                    start:
                      type: string
                      description: Window start in HH:MM UTC, inclusive (e.g. "02:00")
                    end:
                      type: string
                      description: Window end in HH:MM UTC, exclusive (e.g. "06:00"); may wrap midnight if end < start
                checkAfterBackup:
                  type: boolean
                  default: false
                  description: Run restic check after each successful backup to verify repository integrity
                maxRetriesPerDay:
                  type: integer
                  default: 3
                  description: Stop retrying after this many failures in a calendar day (UTC) to prevent retry storms
                notifyOnFailure:
                  type: string
                  description: Webhook URL to POST to on backup failure (JSON payload with name/namespace/result/message/time/duration)
                notifyOnSuccess:
                  type: string
                  description: Webhook URL to POST to on backup success (same JSON payload)
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                lastBackupTime:
                  type: string
                lastBackupResult:
                  type: string
                nextBackupTime:
                  type: string
                message:
                  type: string
                restorePatch:
                  type: string
                recentBackups:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                      result:
                        type: string
                recentRuns:
                  type: array
                  description: Rolling history of the last 30 backup runs with artifact metadata
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      time:
                        type: string
                      result:
                        type: string
                      snapshotId:
                        type: string
                      sizeBytes:
                        type: integer
                      backendType:
                        type: string
                lastRunRef:
                  type: string
                  description: Name of the most recent K8siBackupRun resource
                lastSuccessfulRunRef:
                  type: string
                  description: Name of the most recent successful K8siBackupRun resource
                lastBackupDuration:
                  type: integer
                  description: Duration of the last backup run in seconds
                lastRestoreResult:
                  type: string
                  description: Result of the last restore attempt (success | failed | skipped)
                lastRestoreTime:
                  type: string
                  description: Timestamp of the last restore attempt (ISO 8601)
                lastRestoreSnapshotId:
                  type: string
                  description: Restic short ID of the snapshot restored, empty if skipped
                lastRestoreMessage:
                  type: string
                  description: Human-readable summary of the last restore attempt
                lastRunLog:
                  type: array
                  description: Phase log entries for the most recent backup run, cleared at start of each run
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                      phase:
                        type: string
                      message:
                        type: string
