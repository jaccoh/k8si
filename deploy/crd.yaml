apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: k8sibackups.k8si.io
spec:
  group: k8si.io
  scope: Namespaced
  names:
    plural: k8sibackups
    singular: k8sibackup
    kind: K8siBackup
    shortNames: [k8b]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Last Backup
          type: string
          jsonPath: .status.lastBackupTime
        - name: Result
          type: string
          jsonPath: .status.lastBackupResult
        - name: Next Backup
          type: string
          jsonPath: .status.nextBackupTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [pvc, resticSecret, schedule]
              properties:
                pvc:
                  type: string
                  description: PVC name to back up (must be in the same namespace)
                resticSecret:
                  type: string
                  description: Secret with RESTIC_REPOSITORY, RESTIC_PASSWORD, RESTIC_SFTP_COMMAND, id_ed25519, known_hosts
                schedule:
                  type: string
                  description: Cron schedule for backups, e.g. "0 3 * * *"
                volumeSnapshotClass:
                  type: string
                  default: longhorn
                  description: VolumeSnapshotClass to use when creating snapshots
                restore:
                  type: object
                  description: Restore init-container configuration and pre-restore sanity checks
                  properties:
                    sentinels:
                      type: array
                      description: Files checked on disk (data health) and inside the snapshot (quality gate)
                      items:
                        type: string
                    required:
                      type: boolean
                      default: false
                      description: Fail loudly (CrashLoopBackOff) if no snapshot found instead of starting fresh
                    maxAge:
                      type: string
                      description: Refuse restore if latest snapshot is older than this (e.g. "7d", "168h")
                    size:
                      type: object
                      properties:
                        min:
                          type: string
                          description: Minimum snapshot restore size, e.g. "1Mi"
                        max:
                          type: string
                          description: Maximum snapshot restore size, e.g. "50Gi"
                    tags:
                      type: array
                      description: Only consider snapshots with these tags
                      items:
                        type: string
                retention:
                  type: object
                  properties:
                    daily:
                      type: integer
                      default: 7
                    weekly:
                      type: integer
                      default: 4
                    monthly:
                      type: integer
                      default: 3
                preSnapshotHook:
                  type: string
                  description: Path (inside the k8si image) to a script run before the VolumeSnapshot is taken
                preSnapshotHookRequired:
                  type: boolean
                  default: false
                  description: If true, a non-zero hook exit code aborts the backup (fail-closed)
                database:
                  type: object
                  description: Database-level quiescing before the VolumeSnapshot
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [mariadb, postgres, sqlite]
                    secretRef:
                      type: string
                      description: Secret with DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME (mariadb/postgres)
                    podSelector:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: Label selector to find the running pod for exec (sqlite)
                    dbPaths:
                      type: array
                      description: Paths to SQLite DB files inside the pod (sqlite)
                      items:
                        type: string
                tags:
                  type: array
                  description: Tags applied to backup snapshots
                  items:
                    type: string
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
