apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: k8sibackupruns.k8si.io
spec:
  group: k8si.io
  scope: Namespaced
  names:
    plural: k8sibackupruns
    singular: k8sibackuprun
    kind: K8siBackupRun
    shortNames: [k8br]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Backup
          type: string
          jsonPath: .spec.backupRef
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Started
          type: string
          jsonPath: .status.startTime
        - name: Completed
          type: string
          jsonPath: .status.completionTime
        - name: By
          type: string
          jsonPath: .spec.triggeredBy
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [backupRef, triggeredBy, triggeredAt, mode]
              properties:
                backupRef:
                  type: string
                triggeredBy:
                  type: string
                  enum: [manual, schedule, backfill]
                triggeredAt:
                  type: string
                mode:
                  type: string
                  enum: [snapshot, direct]
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed]
                jobName:
                  type: string
                  description: Name of the K8s Job that executed this run (k8si-{backup}-{ts}); the reconciler reads/deletes the Job by this name
                startTime:
                  type: string
                completionTime:
                  type: string
                message:
                  type: string
                snapshotId:
                  type: string
                  description: Restic/Kopia snapshot ID from the completed backup job
                sizeBytes:
                  type: integer
                  description: Size of the backup in bytes as reported by the backend
                backendType:
                  type: string
                  description: Backend used for this run (restic | kopia)
                log:
                  type: array
                  items:
                    type: object
                    properties:
                      time:
                        type: string
                      phase:
                        type: string
                      message:
                        type: string
