apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8si-operator
  namespace: k8si-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8si-operator
  template:
    metadata:
      labels:
        app: k8si-operator
    spec:
      serviceAccountName: k8si-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/jaccoh/k8si:v0.9.0
          command: [python, -m, kopf, run, --all-namespaces, -m, k8si.operator.main]
          env:
            - name: K8SI_IMAGE
              value: ghcr.io/jaccoh/k8si:v0.9.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
