apiVersion: v1
kind: Namespace
metadata:
  name: k8si-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8si-operator
  namespace: k8si-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8si-operator
rules:
  - apiGroups: [k8si.io]
    resources: [k8sibackups, k8sibackups/status]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8si-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8si-operator
subjects:
  - kind: ServiceAccount
    name: k8si-operator
    namespace: k8si-system
