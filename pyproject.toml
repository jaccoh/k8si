[project]
name = "k8si"
version = "0.2.7"
description = "Kubernetes init container + sidecar for restic backup and restore"
requires-python = ">=3.13"
dependencies = [
    "croniter>=6.0",
    "kopf>=1.44",
    "kubernetes>=31.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
    "pymysql>=1.1",
    "sh>=2.0",
]

[project.scripts]
k8si = "k8si.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
