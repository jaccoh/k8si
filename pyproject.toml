[project]
name = "k8si"
version = "0.9.0rc2"
description = "Kubernetes backup operator with pluggable backends (restic, kopia)"
requires-python = ">=3.13"
dependencies = [
    "croniter>=6.0",
    "fastapi>=0.110",
    "httpx2>=2.0",
    "kopf>=1.44",
    "kubernetes>=31.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
    "pymysql>=1.1",
    "sh>=2.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
k8si = "k8si.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "mypy>=2.3,<3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["k8si"]

[tool.pytest.ini_options]
testpaths = ["tests"]
