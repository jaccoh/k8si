name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy k8si/

  test:
    needs: [lint]
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  docker-build:
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, arm64]
    steps:
      - name: Build and push image (kaniko)
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          JOB="kaniko-${SHORT}"

          kubectl -n gitea apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: gitea
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                - name: kaniko
                  image: gcr.io/kaniko-project/executor:latest
                  args:
                  - --context=https://git.hoeve.nu/hoeve/k8si.git#${SHA}
                  - --destination=docker.hoeve.nu/k8si:${SHA}
                  - --destination=docker.hoeve.nu/k8si:latest
                  - --cache=true
                  - --cache-repo=docker.hoeve.nu/k8si/cache
                  - --skip-tls-verify-registry=docker.hoeve.nu
          YAML

          kubectl -n gitea wait "job/${JOB}" --for=condition=complete --timeout=20m

      - name: Cleanup kaniko job
        if: always()
        run: |
          SHA="${{ github.sha }}"
          kubectl -n gitea delete job "kaniko-${SHA::8}" --ignore-not-found

  e2e:
    needs: [docker-build]
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
      K8SI_IMAGE: docker.hoeve.nu/k8si:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv sync

      - name: Run e2e tests
        run: uv run pytest e2e/ -v --tb=short
