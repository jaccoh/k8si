name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy k8si/

  test:
    needs: [lint]
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  docker-build-arm64:
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and push arm64 image (buildah)
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          JOB="buildah-arm64-${SHORT}"

          kubectl -n gitea apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: gitea
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: hoeve-worker01
                restartPolicy: Never
                containers:
                - name: buildah
                  image: quay.io/buildah/stable:latest
                  securityContext:
                    privileged: true
                    runAsUser: 0
                  command: [sh, -c]
                  args:
                  - |
                    set -e
                    curl -sL "https://git.hoeve.nu/hoeve/k8si/archive/${SHA}.tar.gz" | tar xz
                    cd k8si/
                    buildah build \
                      --arch arm64 --os linux \
                      --build-arg TARGETARCH=arm64 \
                      --tls-verify=false \
                      --tag docker.hoeve.nu/k8si:${SHA}-arm64 \
                      .
                    buildah push --tls-verify=false docker.hoeve.nu/k8si:${SHA}-arm64
          YAML

          for i in $(seq 1 60); do
            ST=$(kubectl get job "${JOB}" -n gitea -o jsonpath='{.status.conditions[0].type}' 2>/dev/null || true)
            echo "iter $i: ST=${ST:-<empty>}"
            if [ "$ST" = "Complete" ] || [ "$ST" = "SuccessCriteriaMet" ]; then exit 0; fi
            if [ "$ST" = "Failed" ] || [ "$ST" = "FailureTarget" ]; then
              kubectl -n gitea describe pod -l "job-name=${JOB}" 2>/dev/null || true
              kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done
          kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          SHA="${{ github.sha }}"
          kubectl -n gitea delete job "buildah-arm64-${SHA::8}" --ignore-not-found

  docker-build-amd64:
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and push amd64 image (buildah)
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          JOB="buildah-amd64-${SHORT}"

          kubectl -n gitea apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: gitea
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: hoeve-worker01
                restartPolicy: Never
                containers:
                - name: buildah
                  image: quay.io/buildah/stable:latest
                  securityContext:
                    privileged: true
                    runAsUser: 0
                  command: [sh, -c]
                  args:
                  - |
                    set -e
                    curl -sL "https://git.hoeve.nu/hoeve/k8si/archive/${SHA}.tar.gz" | tar xz
                    cd k8si/
                    buildah build \
                      --arch amd64 --os linux \
                      --build-arg TARGETARCH=amd64 \
                      --tls-verify=false \
                      --tag docker.hoeve.nu/k8si:${SHA}-amd64 \
                      .
                    buildah push --tls-verify=false docker.hoeve.nu/k8si:${SHA}-amd64
          YAML

          for i in $(seq 1 135); do
            ST=$(kubectl get job "${JOB}" -n gitea -o jsonpath='{.status.conditions[0].type}' 2>/dev/null || true)
            echo "iter $i: ST=${ST:-<empty>}"
            if [ "$ST" = "Complete" ] || [ "$ST" = "SuccessCriteriaMet" ]; then exit 0; fi
            if [ "$ST" = "Failed" ] || [ "$ST" = "FailureTarget" ]; then
              kubectl -n gitea describe pod -l "job-name=${JOB}" 2>/dev/null || true
              kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done
          kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          SHA="${{ github.sha }}"
          kubectl -n gitea delete job "buildah-amd64-${SHA::8}" --ignore-not-found

  docker-build-ui-arm64:
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and push UI arm64 image (buildah)
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          JOB="buildah-ui-arm64-${SHORT}"
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "//;s/"//')

          kubectl -n gitea apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: gitea
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: hoeve-worker01
                restartPolicy: Never
                containers:
                - name: buildah
                  image: quay.io/buildah/stable:latest
                  securityContext:
                    privileged: true
                    runAsUser: 0
                  command: [sh, -c]
                  args:
                  - |
                    set -e
                    curl -sL "https://git.hoeve.nu/hoeve/k8si/archive/${SHA}.tar.gz" | tar xz
                    cd k8si/k8si/ui/
                    buildah build \
                      --arch arm64 --os linux \
                      --tls-verify=false \
                      --build-arg K8SI_VERSION=${VERSION} \
                      --tag docker.hoeve.nu/k8si-ui:${SHA}-arm64 \
                      .
                    buildah push --tls-verify=false docker.hoeve.nu/k8si-ui:${SHA}-arm64
          YAML

          for i in $(seq 1 60); do
            ST=$(kubectl get job "${JOB}" -n gitea -o jsonpath='{.status.conditions[0].type}' 2>/dev/null || true)
            echo "iter $i: ST=${ST:-<empty>}"
            if [ "$ST" = "Complete" ] || [ "$ST" = "SuccessCriteriaMet" ]; then exit 0; fi
            if [ "$ST" = "Failed" ] || [ "$ST" = "FailureTarget" ]; then
              kubectl -n gitea describe pod -l "job-name=${JOB}" 2>/dev/null || true
              kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done
          kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          SHA="${{ github.sha }}"
          kubectl -n gitea delete job "buildah-ui-arm64-${SHA::8}" --ignore-not-found

  docker-build-ui-amd64:
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build and push UI amd64 image (buildah)
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          JOB="buildah-ui-amd64-${SHORT}"
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "//;s/"//')

          kubectl -n gitea apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: gitea
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: hoeve-worker01
                restartPolicy: Never
                containers:
                - name: buildah
                  image: quay.io/buildah/stable:latest
                  securityContext:
                    privileged: true
                    runAsUser: 0
                  command: [sh, -c]
                  args:
                  - |
                    set -e
                    curl -sL "https://git.hoeve.nu/hoeve/k8si/archive/${SHA}.tar.gz" | tar xz
                    cd k8si/k8si/ui/
                    buildah build \
                      --arch amd64 --os linux \
                      --tls-verify=false \
                      --build-arg K8SI_VERSION=${VERSION} \
                      --tag docker.hoeve.nu/k8si-ui:${SHA}-amd64 \
                      .
                    buildah push --tls-verify=false docker.hoeve.nu/k8si-ui:${SHA}-amd64
          YAML

          for i in $(seq 1 135); do
            ST=$(kubectl get job "${JOB}" -n gitea -o jsonpath='{.status.conditions[0].type}' 2>/dev/null || true)
            echo "iter $i: ST=${ST:-<empty>}"
            if [ "$ST" = "Complete" ] || [ "$ST" = "SuccessCriteriaMet" ]; then exit 0; fi
            if [ "$ST" = "Failed" ] || [ "$ST" = "FailureTarget" ]; then
              kubectl -n gitea describe pod -l "job-name=${JOB}" 2>/dev/null || true
              kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
              exit 1
            fi
            sleep 20
          done
          kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          SHA="${{ github.sha }}"
          kubectl -n gitea delete job "buildah-ui-amd64-${SHA::8}" --ignore-not-found

  docker-manifest:
    needs: [docker-build-arm64, docker-build-amd64, docker-build-ui-arm64, docker-build-ui-amd64]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Create multi-arch manifest lists (buildah)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA::8}"
          JOB="buildah-manifest-${SHORT}"
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "//;s/"//')

          kubectl -n gitea apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: gitea
          spec:
            ttlSecondsAfterFinished: 300
            backoffLimit: 0
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: hoeve-worker01
                restartPolicy: Never
                containers:
                - name: buildah
                  image: quay.io/buildah/stable:latest
                  securityContext:
                    privileged: true
                    runAsUser: 0
                  command: [sh, -c]
                  args:
                  - |
                    set -ex
                    buildah login ghcr.io -u jaccoh -p ${GHCR_TOKEN}
                    buildah manifest create k8si-manifest
                    buildah manifest add --tls-verify=false k8si-manifest docker.hoeve.nu/k8si:${SHA}-arm64
                    buildah manifest add --tls-verify=false k8si-manifest docker.hoeve.nu/k8si:${SHA}-amd64
                    buildah manifest push --all --tls-verify=false k8si-manifest docker://docker.hoeve.nu/k8si:${SHA}
                    buildah manifest push --all --tls-verify=false k8si-manifest docker://docker.hoeve.nu/k8si:v${VERSION}
                    buildah manifest push --all --tls-verify=false k8si-manifest docker://docker.hoeve.nu/k8si:latest
                    buildah manifest push --all k8si-manifest docker://ghcr.io/jaccoh/k8si:${SHA}
                    buildah manifest push --all k8si-manifest docker://ghcr.io/jaccoh/k8si:v${VERSION}
                    buildah manifest push --all k8si-manifest docker://ghcr.io/jaccoh/k8si:latest
                    buildah manifest create k8si-ui-manifest
                    buildah manifest add --tls-verify=false k8si-ui-manifest docker.hoeve.nu/k8si-ui:${SHA}-arm64
                    buildah manifest add --tls-verify=false k8si-ui-manifest docker.hoeve.nu/k8si-ui:${SHA}-amd64
                    buildah manifest push --all --tls-verify=false k8si-ui-manifest docker://docker.hoeve.nu/k8si-ui:${SHA}
                    buildah manifest push --all --tls-verify=false k8si-ui-manifest docker://docker.hoeve.nu/k8si-ui:v${VERSION}
                    buildah manifest push --all --tls-verify=false k8si-ui-manifest docker://docker.hoeve.nu/k8si-ui:latest
                    buildah manifest push --all k8si-ui-manifest docker://ghcr.io/jaccoh/k8si-ui:${SHA}
                    buildah manifest push --all k8si-ui-manifest docker://ghcr.io/jaccoh/k8si-ui:v${VERSION}
                    buildah manifest push --all k8si-ui-manifest docker://ghcr.io/jaccoh/k8si-ui:latest
          YAML

          for i in $(seq 1 18); do
            ST=$(kubectl get job "${JOB}" -n gitea -o jsonpath='{.status.conditions[0].type}' 2>/dev/null || true)
            echo "iter $i: ST=${ST:-<empty>}"
            if [ "$ST" = "Complete" ] || [ "$ST" = "SuccessCriteriaMet" ]; then exit 0; fi
            if [ "$ST" = "Failed" ] || [ "$ST" = "FailureTarget" ]; then
              kubectl -n gitea describe pod -l "job-name=${JOB}" 2>/dev/null || true
              kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done
          kubectl -n gitea logs -l "job-name=${JOB}" --tail=100 2>/dev/null || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          SHA="${{ github.sha }}"
          kubectl -n gitea delete job "buildah-manifest-${SHA::8}" --ignore-not-found

  e2e:
    needs: [docker-manifest]
    runs-on: [self-hosted, arm64]
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
      K8SI_IMAGE: docker.hoeve.nu/k8si:${{ github.sha }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv sync

      - name: Run e2e tests
        run: uv run pytest e2e/ -v --tb=short --log-cli-level=INFO

  release:
    needs: [e2e]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Create Gitea release
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "//;s/"//')
          TAG="v${VERSION}"
          API="https://git.hoeve.nu/api/v1/repos/hoeve/k8si"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${API}/releases/tags/${TAG}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}")

          if [ "$STATUS" = "200" ]; then
            echo "Release ${TAG} already exists, skipping"
            exit 0
          fi

          PRERELEASE="false"
          if echo "${TAG}" | grep -qE 'rc|alpha|beta|-'; then
            PRERELEASE="true"
          fi

          curl -s -X POST "${API}/releases" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"target_commitish\": \"${{ github.sha }}\",
              \"name\": \"${TAG}\",
              \"prerelease\": ${PRERELEASE},
              \"body\": \"Docker images (multi-arch arm64+amd64):\n- \`ghcr.io/jaccoh/k8si:v${VERSION}\`\n- \`ghcr.io/jaccoh/k8si-ui:v${VERSION}\`\"
            }"

          echo "Published release ${TAG}"
