name: Release

# GitHub is the public face of the project; the Gitea pipeline is the CI that
# builds, tests (incl. e2e) and publishes images to ghcr. This workflow only
# creates the public GitHub release with generated notes when a v* tag lands.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}
