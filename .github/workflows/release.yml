name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.2.3
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "minor=${TAG%.*}" >> "$GITHUB_OUTPUT"   # v1.2
          echo "major=${TAG%%.*}" >> "$GITHUB_OUTPUT"  # v1

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major }}
            ghcr.io/${{ github.repository }}:latest
      - name: Build and push k8si-ui image
        uses: docker/build-push-action@v6
        with:
          context: k8si/ui
          file: k8si/ui/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            K8SI_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}-ui:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}-ui:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository }}-ui:${{ steps.version.outputs.major }}
            ghcr.io/${{ github.repository }}-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}
