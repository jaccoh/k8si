apiVersion: batch/v1
kind: Job
metadata:
  name: k8si-wipe
  namespace: k8si-test
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8si-test-data
      containers:
        - name: wiper
          image: alpine:3.19
          command: [sh, -c]
          args:
            - |
              echo "=== Before wipe ==="
              find /data -type f | sort
              rm -rf /data/*
              echo "=== After wipe (should be empty) ==="
              ls -la /data/
              echo "=== Simulated data loss complete ==="
          volumeMounts:
            - name: data
              mountPath: /data
